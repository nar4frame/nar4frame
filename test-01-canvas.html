<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canvas Test</title>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:40px;

}

h1{

    margin-bottom:30px;

}

canvas{

    display:block;
    width:700px;
    max-width:100%;
    height:auto;
    border-radius:16px;

}

</style>

</head>

<body>

<h1>LAB 01 - Canvas</h1>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const img = new Image();

img.src = "images/DSC_0235.jpg";

img.onload = () => {

    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img,0,0);

};

</script>

</body>

</html>
